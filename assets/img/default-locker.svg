<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="holdmybag Schließfächer">
  <defs>
    <linearGradient id="hmbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#693e7e"/>
      <stop offset="0.55" stop-color="#7a4b8f"/>
      <stop offset="1" stop-color="#18bdc5"/>
    </linearGradient>
    <!-- Ein Schließfach: Tür-Rahmen + Griff. Als Pattern über die ganze Fläche gekachelt. -->
    <pattern id="lockers" width="150" height="169" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect x="12" y="12" width="126" height="145" rx="10"
            fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
      <rect x="26" y="60" width="8" height="34" rx="4" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#hmbBg)"/>
  <rect width="1200" height="675" fill="url(#lockers)"/>
  <!-- dezenter Verlauf unten für Text-Lesbarkeit über dem Bild -->
  <rect width="1200" height="675" fill="#4e2e5f" fill-opacity="0.18"/>
</svg>
